name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.gh-page/**'
      - 'src/**'
      - 'contract/**'
      - '.laranex-schema-allowlist.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.viewer.config.ts'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.gh-page/**'
      - 'contract/scan.mjs'
      - 'src/contract/scan.ts'
      - '.laranex-schema-allowlist.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .gh-page/package-lock.json
      - name: Build the viewer the demo embeds
        run: |
          npm ci
          npm run build
      - name: Install documentation dependencies
        working-directory: .gh-page
        run: npm ci
      # check-build.mjs also runs the snapshot scanner over the whole site: only the allowlisted demo snapshots.
      - name: Test, build, verify production links, and scan for schema snapshots
        working-directory: .gh-page
        run: npm run check
      - name: Scan the Pages artifact for schema snapshots
        run: node contract/scan.mjs --artifacts .gh-page/.vitepress/dist
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .gh-page/.vitepress/dist

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
