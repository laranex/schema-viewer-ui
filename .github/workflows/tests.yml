name: tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24', '26']
        include:
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run contract:check
      # The repository and its build output hold no schema document but the allowlisted synthetic ones; any non-zero
      # exit (exposure, uncertain or incomplete scan) fails. test:package scans the packed tarball the same way.
      - name: Scan for schema snapshots
        run: node contract/scan.mjs --tracked --untracked --artifacts dist --report "$RUNNER_TEMP/scan-report.json"
      - run: npm run test:package
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: scan-report-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/scan-report.json
          if-no-files-found: ignore
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
